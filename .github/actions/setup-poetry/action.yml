name: Setup Poetry and dependencies
description: Setup Python, Poetry and install dependencies with caching

inputs:
  python-version:
    description: Python version to use
    required: false
    default: "3.13"

  install-extras:
    description: Install extra dependencies (--all-extras or specific)
    required: false
    default: ""

  install-dev:
    description: Install dev dependencies
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    - name: Load cached venv
      uses: actions/cache@v4
      id: cached-poetry-dependencies
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          venv-${{ runner.os }}-${{ inputs.python-version }}-

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: |
        poetry lock
        poetry install ${{ inputs.install-extras }} ${{ inputs.install-dev == 'true' && '--with dev' || '' }}
      shell: bash
