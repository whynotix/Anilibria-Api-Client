name: PR

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "anilibria_api_client/**"
      - "tests/**"

jobs:
  pre-pr-tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Poetry and dependencies
        uses: ./.github/actions/setup-poetry
        with:
          python-version: "3.13"
          install-dev: "true"

      - name: Create .env file
        env:
          ANILIBRIA_API_TOKEN: ${{ secrets.ANILIBRIA_API_TOKEN }}
          LOGIN: ${{ secrets.LOGIN }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          echo "ANILIBRIA_API_TOKEN=$ANILIBRIA_API_TOKEN" > .env
          echo "LOGIN=$LOGIN" >> .env
          echo "PASSWORD=$PASSWORD" >> .env

      - name: Run tests with pytest
        run: |
          poetry run pytest -q tests/ -s

  pre-pr-bump-lock-file:
    name: Bump lock file
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Poetry and dependencies
        uses: ./.github/actions/setup-poetry
        with:
          python-version: "3.13"
          install-dev: "true"

      - name: Update poetry.lock
        run: |
          poetry lock

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if git diff --quiet poetry.lock; then
            echo "No changes in poetry.lock"
          else
            git add poetry.lock
            git commit -m "chore: update poetry.lock [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
